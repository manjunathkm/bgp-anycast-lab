! ============================================
! mac-speaker FRR BGP Configuration
! Step 2: Basic BGP router setup
! AS: 65001 | Router-ID: 172.20.0.2
! ============================================

frr version 10.0
frr defaults traditional
hostname mac-speaker
log syslog informational
no ipv6 forwarding
service integrated-vtysh-config
!
router bgp 65001
 bgp router-id 172.20.0.2
 bgp log-neighbor-changes
 no bgp default ipv4-unicast
 !
 ! Neighbors will be added in Step 3 (iBGP) and Step 4 (eBGP)
 !
 address-family ipv4 unicast
 exit-address-family
!
line vty
!
