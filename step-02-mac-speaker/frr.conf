! ============================================
! mac-speaker FRR BGP Configuration
! Step 2: Basic BGP router - no peers yet
! AS: 65001 | Router-ID: 172.20.0.2
! ============================================
frr version 10.2.1_git
frr defaults traditional
hostname mac-speaker
log syslog informational
no ipv6 forwarding
service integrated-vtysh-config
!
router bgp 65001
 bgp router-id 172.20.0.2
 bgp log-neighbor-changes
 no bgp default ipv4-unicast
 !
 address-family ipv4 unicast
 exit-address-family
!
line vty
!
