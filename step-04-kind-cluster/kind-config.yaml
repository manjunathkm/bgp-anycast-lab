# ============================================
# kind cluster config for BGP Anycast Lab
# Step 4b: kind cluster on bgp-lab network
# ============================================
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: bgp-anycast

networking:
  # Disable default CNI — we will install MetalLB later
  disableDefaultCNI: false
  # Pod subnet — avoid overlap with bgp-lab (172.20.0.0/24)
  podSubnet: "10.244.0.0/16"
  serviceSubnet: "10.96.0.0/12"

nodes:
  - role: control-plane
    image: kindest/node:v1.32.0
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "ingress-ready=true"
    extraPortMappings:
      - containerPort: 80
        hostPort: 8080
        protocol: TCP
      - containerPort: 443
        hostPort: 8443
        protocol: TCP

  - role: worker
    image: kindest/node:v1.32.0

  - role: worker
    image: kindest/node:v1.32.0
