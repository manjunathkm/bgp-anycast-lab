! ============================================
! k8s-bgp-speaker FRR BGP Configuration
! Step 5c: MetalLB BGP peers added
! AS: 65001 | Router-ID: 172.20.0.3
! iBGP peers:
!   mac-speaker     172.20.0.2  (bgp-lab network)
!   metallb-worker  192.168.97.2 (kind network)
!   metallb-cp      192.168.97.3 (kind network)
!   metallb-worker2 192.168.97.4 (kind network)
! ============================================
frr version 10.2.1_git
frr defaults traditional
hostname k8s-bgp-speaker
log syslog informational
no ipv6 forwarding
service integrated-vtysh-config
!
router bgp 65001
 bgp router-id 172.20.0.3
 bgp log-neighbor-changes
 no bgp default ipv4-unicast
 !
 neighbor 172.20.0.2 remote-as 65001
 neighbor 172.20.0.2 description mac-speaker
 !
 neighbor 192.168.97.2 remote-as 65001
 neighbor 192.168.97.2 description metallb-speaker-worker
 neighbor 192.168.97.3 remote-as 65001
 neighbor 192.168.97.3 description metallb-speaker-control-plane
 neighbor 192.168.97.4 remote-as 65001
 neighbor 192.168.97.4 description metallb-speaker-worker2
 !
 address-family ipv4 unicast
  neighbor 172.20.0.2 activate
  neighbor 192.168.97.2 activate
  neighbor 192.168.97.3 activate
  neighbor 192.168.97.4 activate
 exit-address-family
!
line vty
!
