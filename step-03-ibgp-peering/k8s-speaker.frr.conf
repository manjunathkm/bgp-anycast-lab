! ============================================
! k8s-bgp-speaker FRR BGP Configuration
! Step 3a: Second BGP router - no peers yet
! AS: 65001 | Router-ID: 172.20.0.3
! ============================================
frr version 10.2.1_git
frr defaults traditional
hostname k8s-bgp-speaker
log syslog informational
no ipv6 forwarding
service integrated-vtysh-config
!
router bgp 65001
 bgp router-id 172.20.0.3
 bgp log-neighbor-changes
 no bgp default ipv4-unicast
 !
 address-family ipv4 unicast
 exit-address-family
!
line vty
!
