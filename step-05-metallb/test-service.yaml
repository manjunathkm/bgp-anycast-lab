# ============================================
# Test LoadBalancer Service
# Step 5d: Verify MetalLB assigns VIP from pool
# ============================================
apiVersion: v1
kind: Service
metadata:
  name: test-anycast-vip
  namespace: default
  annotations:
    metallb.universe.tf/address-pool: anycast-vip-pool
spec:
  type: LoadBalancer
  selector:
    app: test-nginx
  ports:
  - port: 80
    targetPort: 80
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: test-nginx
  namespace: default
spec:
  replicas: 2
  selector:
    matchLabels:
      app: test-nginx
  template:
    metadata:
      labels:
        app: test-nginx
    spec:
      containers:
      - name: nginx
        image: nginx:alpine
        ports:
        - containerPort: 80
